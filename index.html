<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Buzzer Realtime Supabase</title>
    <!-- Memuat Supabase JS Client dari CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background: #f0f2f5;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        input {
            width: 80%;
            padding: 12px;
            font-size: 16px;
            margin-bottom: 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
        }
        input:focus {
            border-color: #3ecf8e;
        }
        #buzzer {
            width: 180px;
            height: 180px;
            font-size: 22px;
            font-weight: bold;
            background: #3ecf8e;
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(62, 207, 142, 0.4);
            transition: 0.1s;
        }
        #buzzer:active {
            transform: scale(0.95);
        }
        #buzzer:disabled {
            background: #ccc;
            box-shadow: none;
            cursor: not-allowed;
        }
        #status {
            margin-top: 25px;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            min-height: 50px;
        }
        #resetBtn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 14px;
            background: #2f3542;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        #resetBtn:hover {
            background: #57606f;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>⚡ Game Buzzer Realtime ⚡</h2>
        <p>Masukkan nama kamu sebelum memencet!</p>
        <input type="text" id="playerName" placeholder="Nama Kamu...">
        <br>
        <button id="buzzer">PENCET!</button>
        
        <div id="status">Menunggu pemain...</div>
        
        <button id="resetBtn">Reset Buzzer (Host)</button>
    </div>

    <script>
        // Konfigurasi Supabase menggunakan akun kamu
        const SUPABASE_URL = 'https://hdtuhrfwgjzlgstaqsag.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_AKyaT4Wj-uFiiAsfiRYYiA_hq5-P1S2';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const buzzerBtn = document.getElementById('buzzer');
        const statusDiv = document.getElementById('status');
        const nameInput = document.getElementById('playerName');
        const resetBtn = document.getElementById('resetBtn');

        // Fungsi untuk mengambil status awal dari database
        async function fetchState() {
            const { data, error } = await supabase
                .from('buzzer')
                .select('winner')
                .eq('id', 1)
                .single();
            
            if (data) {
                updateUI(data.winner);
            }
        }

        // Update tampilan berdasarkan siapa pemenangnya
        function updateUI(winner) {
            if (winner) {
                statusDiv.innerHTML = `🎉 PEMENANG:<br><span style="color: #3ecf8e; font-size: 24px;">${winner}</span>`;
                buzzerBtn.disabled = true;
                nameInput.disabled = true;
            } else {
                statusDiv.innerHTML = "Menunggu pemain menekan buzzer...";
                buzzerBtn.disabled = false;
                nameInput.disabled = false;
            }
        }

        // 1. Aksi ketika tombol buzzer ditekan
        buzzerBtn.addEventListener('click', async () => {
            const name = nameInput.value.trim();
            if (!name) {
                alert("Mohon masukkan nama kamu terlebih dahulu!");
                nameInput.focus();
                return;
            }

            // Cek dulu apakah sudah ada pemenang di database
            const { data: current } = await supabase
                .from('buzzer')
                .select('winner')
                .eq('id', 1)
                .single();

            if (current && !current.winner) {
                // Jika belum ada pemenang, update baris id=1 dengan nama pemain ini
                await supabase
                    .from('buzzer')
                    .update({ winner: name, updated_at: Date.now() })
                    .eq('id', 1);
            }
        });

        // 2. Mendengarkan perubahan data secara real-time via WebSocket Supabase
        supabase
            .channel('public:buzzer')
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'buzzer' }, (payload) => {
                const newWinner = payload.new.winner;
                updateUI(newWinner);
            })
            .subscribe();

        // 3. Tombol Reset untuk Host
        resetBtn.addEventListener('click', async () => {
            await supabase
                .from('buzzer')
                .update({ winner: null, updated_at: null })
                .eq('id', 1);
            nameInput.value = '';
        });

        // Muat status saat pertama kali halaman dibuka
        fetchState();
    </script>
</body>
</html>
